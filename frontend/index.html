<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UGC Ads Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🎥 UGC Ads Studio</h1>
    <p class="subtitle">Génère des pubs UGC avec un avatar IA qui parle de ton produit</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. Le produit</h2>
      <input id="product-name" type="text" placeholder="Nom du produit..." autocomplete="off" required style="width:100%;margin-bottom:0.6rem;" />
      <textarea id="product-description" placeholder="Décris le produit en quelques mots (pour générer un script automatiquement)..." rows="3" style="width:100%;margin-bottom:0.6rem;padding:0.6rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:#10131f;color:var(--text);font-family:inherit;"></textarea>
      <button type="button" id="generate-script-btn">✨ Générer un script avec l'IA</button>
      <span id="generate-script-status" class="hint"></span>
    </section>

    <section class="panel">
      <h2>2. Le script</h2>
      <textarea id="script-text" placeholder="Le texte que l'avatar va dire..." rows="4" required style="width:100%;padding:0.6rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:#10131f;color:var(--text);font-family:inherit;"></textarea>
      <p class="hint"><span id="script-char-count">0</span> caractères</p>
    </section>

    <section class="panel">
      <h2>3. L'avatar</h2>
      <div id="avatar-status" class="hint"></div>
      <div id="avatar-grid" class="avatar-grid"></div>
    </section>

    <section class="panel">
      <h2>4. La voix</h2>
      <select id="voice-select" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);background:#10131f;color:var(--text);">
        <option value="">Chargement des voix...</option>
      </select>
    </section>

    <section class="panel">
      <h2>5. Format &amp; options</h2>
      <label style="margin-right:1.5rem;"><input type="radio" name="aspect" value="vertical" checked> Vertical 9:16 (TikTok / Reels / Shorts)</label>
      <label><input type="radio" name="aspect" value="horizontal"> Horizontal 16:9</label>
      <br><br>
      <label><input type="checkbox" id="captions-enabled" checked> Incruster des sous-titres façon UGC</label>
      <br><br>
      <button type="button" id="create-ad-btn">🚀 Générer la pub</button>
      <div id="create-ad-status"></div>
    </section>

    <section class="panel">
      <h2>Mes pubs</h2>
      <div id="ads-list" class="movie-list"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
